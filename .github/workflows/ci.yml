name: ScrimFinder CI

concurrency:
  group: scrimfinder-ci
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - add_tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  java_light_tests:
    name: java light tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: run unit and integration-light tests
        run: |
          chmod +x mvnw
          ./mvnw test -Dgroups=unit-tests,light-integration-tests -Pdev

  java_heavy_tests:
    name: java heavy tests
    runs-on: ubuntu-latest
    needs:
      - java_light_tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: run integration-heavy and e2e tests
        run: |
          chmod +x mvnw
          ./mvnw verify -Dgroups=heavy-integration-tests,e2e-tests -Pstaging
